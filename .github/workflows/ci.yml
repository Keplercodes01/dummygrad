name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub-hosted runners have no NVIDIA GPU, so CI covers the CPU backend (and the
  # Metal build on macOS). CUDA is verified with notebooks/dummygrad_colab.ipynb.
  build-test:
    name: ${{ matrix.os }} (CPU)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_CUDA=OFF

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build --output-on-failure --verbose

      - name: Benchmark smoke run
        run: ./build/dg_bench tiny && ./build/dg_bench small --seconds 5

  # The built-in matrix multiply, used when no BLAS is found
  no-blas:
    name: ubuntu-latest (CPU, no BLAS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_CUDA=OFF -DDUMMYGRAD_USE_BLAS=OFF

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # On one machine, because runners differ: main, this branch, and this branch without a BLAS
      - name: Benchmark against main
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)"
          sudo apt-get update -qq && sudo apt-get install -y -qq libopenblas-dev > /dev/null
          git fetch -q --depth 1 origin main && git worktree add -q ../main FETCH_HEAD
          for src in ../main .; do
            cmake -S $src -B $src/build-blas -DCMAKE_BUILD_TYPE=Release -DENABLE_CUDA=OFF > /dev/null
            cmake --build $src/build-blas -j 4 --target dg_bench > /dev/null
          done
          for bench in ../main/build-blas ./build-blas ./build; do
            echo "== $bench"
            $bench/dg_bench tiny && $bench/dg_bench small --seconds 5
          done

  # The CPU suites built with sanitizers: memory errors and leaks (ASan), undefined behaviour
  # (UBSan: overflow, bad casts such as NaN to an integer, misalignment), and data races between
  # the thread pool, the Prefetcher and the backward workers (TSan). Without a BLAS, so that every
  # matrix product is instrumented too (OpenBLAS's own threads would be false races for TSan).
  sanitizers:
    name: ubuntu-latest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            flags: -fsanitize=address,undefined
          - name: TSan
            flags: -fsanitize=thread
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
      DUMMYGRAD_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_CUDA=OFF -DDUMMYGRAD_USE_BLAS=OFF
          -DDUMMYGRAD_BUILD_EXAMPLES=OFF -DDUMMYGRAD_BUILD_BENCHMARKS=OFF
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          "-DCMAKE_CXX_FLAGS=${{ matrix.flags }} -fno-omit-frame-pointer -g"
          "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.flags }}"

      - name: Build
        run: cmake --build build -j 4

      # Every suite runs, and UBSan reports and goes on, so that one finding does not hide the next
      - name: Test
        working-directory: build
        run: |
          status=0
          for t in test_engine test_research test_models; do
            echo "== $t"
            ./$t 2>&1 | tee $t.log
            [ "${PIPESTATUS[0]}" = 0 ] || status=1
            if grep -q "runtime error:" $t.log; then status=1; fi
          done
          echo "== UBSan findings"
          cat *.log | grep -h "runtime error:" | sort | uniq -c | sort -rn || true
          exit $status

  # No GPU on hosted runners: compile the CUDA backend and everything that includes it, so kernel
  # and header errors surface here instead of on a GPU machine. Running it happens on Colab.
  cuda-build:
    name: CUDA build (compile only)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake g++ git libopenblas-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75

      - name: Build
        run: cmake --build build -j 4

  consumer:
    name: FetchContent consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure downstream project against this checkout
        run: >
          cmake -S tests/consumer -B build-consumer -DCMAKE_BUILD_TYPE=Release -DENABLE_CUDA=OFF
          -DFETCHCONTENT_SOURCE_DIR_DUMMYGRAD=${{ github.workspace }}

      - name: Build
        run: cmake --build build-consumer -j 4

      - name: Run
        run: ./build-consumer/my_app
