name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub-hosted runners have no NVIDIA GPU, so CI covers the CPU backend (and the
  # Metal build on macOS). CUDA is verified with notebooks/dummygrad_colab.ipynb.
  build-test:
    name: ${{ matrix.os }} (CPU)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_CUDA=OFF

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build --output-on-failure --verbose

      - name: Benchmark smoke run
        run: ./build/dg_bench tiny

  # No GPU on hosted runners: compile the CUDA backend and everything that includes it, so kernel
  # and header errors surface here instead of on a GPU machine. Running it happens on Colab.
  cuda-build:
    name: CUDA build (compile only)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake g++ git libopenblas-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75

      - name: Build
        run: cmake --build build -j 4

  consumer:
    name: FetchContent consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure downstream project against this checkout
        run: >
          cmake -S tests/consumer -B build-consumer -DCMAKE_BUILD_TYPE=Release -DENABLE_CUDA=OFF
          -DFETCHCONTENT_SOURCE_DIR_DUMMYGRAD=${{ github.workspace }}

      - name: Build
        run: cmake --build build-consumer -j 4

      - name: Run
        run: ./build-consumer/my_app
